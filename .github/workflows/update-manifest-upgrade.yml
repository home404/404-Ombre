name: Regenerate upgrade manifest

on:
  push:
    branches:
      - upgrade/ombre-3.2.0
    paths:
      - 'src/**'
      - 'frontend/**'
      - 'VERSION'
      - '.github/workflows/update-manifest-upgrade.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/ombre-3.2.0
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate manifest from repository bytes
        run: python deploy/gen_update_manifest.py
      - name: Commit manifest if changed
        run: |
          if git diff --quiet -- update_manifest.json; then
            echo 'manifest already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update_manifest.json
          git commit -m 'chore: regenerate update manifest for 3.2.0 upgrade'
          git push origin HEAD:upgrade/ombre-3.2.0
