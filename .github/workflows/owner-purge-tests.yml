name: Owner purge validation

on:
  push:
    branches:
      - feat/owner-authorized-purge
  pull_request:
    branches:
      - production

jobs:
  owner-purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install locked development dependencies
        run: |
          python -m pip install "uv==0.11.23"
          uv pip sync requirements-dev.lock.txt --require-hashes --system

      - name: Compile runtime
        run: python -m compileall -q src

      - name: Run full static checks
        run: ruff check src tools deploy tests --no-cache

      - name: Run owner purge regressions
        run: python -m pytest tests/test_owner_purge.py -q --asyncio-mode=auto

      - name: Run full local suite
        run: python -m pytest tests -q --asyncio-mode=auto
